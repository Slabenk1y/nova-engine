name: Build & Release Android APK

on:
  push:
    branches: [ "main", "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "ndk;26.3.11579264"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Signed APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./android/build_apk.sh

      - name: Compute APK Checksum
        run: |
          sha256sum android/build/outputs/apk/nova-debug.apk > android/build/outputs/apk/nova-debug.apk.sha256
          cat android/build/outputs/apk/nova-debug.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-obby-android-debug-apk
          path: |
            android/build/outputs/apk/nova-debug.apk
            android/build/outputs/apk/nova-debug.apk.sha256
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/outputs/apk/nova-debug.apk
            android/build/outputs/apk/nova-debug.apk.sha256
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
